<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-SMART - ระบบจองรถส่วนกลาง อบต.ข่วงเปา</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .glass-card { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(16, 185, 129, 0.2); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        .neon-btn { background: linear-gradient(135deg, #10B981 0%, #059669 100%); box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); transition: all 0.3s ease; }
    </style>
</head>
<body class="min-h-screen py-8 px-4 flex flex-col items-center">

    <div class="max-w-md w-full glass-card rounded-3xl p-6 space-y-6">
        <!-- Header -->
        <div class="flex items-center gap-3 border-b border-emerald-100 pb-4">
            <div class="w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-xl font-bold">
                <i class="fa-solid fa-car-side"></i>
            </div>
            <div>
                <h1 class="text-base font-bold text-slate-900">ระบบขอใช้รถ อบต.ข่วงเปา</h1>
                <p class="text-xs text-slate-500">คลังยานพาหนะส่วนรวม 24 คัน (ทุกกองใช้ร่วมกัน)</p>
            </div>
        </div>

        <!-- Form Section -->
        <div class="space-y-4 text-xs">
            <div>
                <label class="block font-bold text-slate-700 mb-1">สังกัดกองของผู้ขอ:</label>
                <select id="user-dept" class="w-full border border-slate-300 rounded-xl p-2.5 bg-slate-50 font-semibold" onchange="checkFleetStatus()">
                    <option value="สำนักปลัด">สำนักปลัด (รถประจำกอง: เต็ม/ไม่ว่าง)</option>
                    <option value="กองคลัง">กองคลัง (รถประจำกอง: ว่าง)</option>
                    <option value="กองช่าง">กองช่าง (รถประจำกอง: ว่าง)</option>
                </select>
            </div>

            <div>
                <label class="block font-bold text-slate-700 mb-1">วัตถุประสงค์การเดินทาง:</label>
                <input type="text" value="เดินทางไปประชุมราชการ ณ อำเภอจอมทอง" class="w-full border border-slate-300 rounded-xl p-2.5 bg-slate-50 font-semibold">
            </div>

            <!-- Smart Suggestion Box (ระบบแนะนำรถต่างกองอัตโนมัติ) -->
            <div id="fallback-box" class="bg-amber-50 border border-amber-200 rounded-2xl p-4 space-y-2">
                <div class="flex items-center gap-2 text-amber-800 font-bold">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>แจ้งเตือนระบบส่วนกลาง</span>
                </div>
                <p class="text-[11px] text-amber-700 leading-relaxed">
                    รถประจำกองของท่านขณะนี้ติดภารกิจทั้งหมด ระบบได้ดึงรถว่างจากกองอื่นมาให้ท่านเลือกใช้ทดแทนตามนโยบายบริหารจัดการร่วม (Shared Fleet)
                </p>
                <div class="pt-1">
                    <label class="block font-bold text-slate-700 mb-1">เลือกยานพาหนะทดแทนจากคลังกลาง:</label>
                    <select class="w-full border border-amber-300 rounded-xl p-2.5 bg-white font-bold text-emerald-700">
                        <option>🚗 กจ 5678 เชียงใหม่ - Toyota Revo (กองคลัง - พร้อมใช้)</option>
                        <option>🚙 กฉ 8888 เชียงใหม่ - Isuzu D-Max 4x4 (กองช่าง - พร้อมใช้)</option>
                        <option>🚐 กค 9988 เชียงใหม่ - Toyota Commuter (สำนักปลัด - รถตู้กลาง)</option>
                    </select>
                </div>
            </div>

            <!-- พลขับอัตโนมัติ -->
            <div>
                <label class="block font-bold text-slate-700 mb-1">พนักงานขับรถประจำทริป:</label>
                <input type="text" value="นายส่งเสริม ฟั่นเฟือนหา (จัดสรรจากพลขับกลาง)" readonly class="w-full border border-slate-300 rounded-xl p-2.5 bg-slate-100 font-semibold text-slate-600">
            </div>
        </div>

        <button onclick="alert('ส่งคำขอสำเร็จ! ระบบได้บันทึกและส่งแจ้งเตือนไปยังผู้บริหารเพื่อพิจารณาอนุมัติแล้ว')" class="w-full neon-btn text-white font-bold py-3.5 rounded-xl text-xs uppercase tracking-wider flex items-center justify-center gap-2">
            <i class="fa-solid fa-paper-plane"></i> ยืนยันการขอใช้รถ (สร้างแบบ 3 อัตโนมัติ)
        </button>
    </div>

</body>
</html>
