<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-SMART Fleet Management - อบต.ข่วงเปา</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', 'Sarabun', sans-serif; 
            background: radial-gradient(circle at 50% -20%, #1e293b 0%, #0b0f17 60%, #05070a 100%);
            color: #f8fafc; 
            min-height: 100vh;
        }
        .glass-panel { 
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.85) 100%); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7); 
        }
        .industrial-btn { 
            background: linear-gradient(135deg, #334155 0%, #1e293b 50%, #0f172a 100%); 
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease; 
        }
        .industrial-btn:hover { 
            background: linear-gradient(135deg, #475569 0%, #334155 50%, #1e293b 100%);
            transform: translateY(-2px); 
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.25);
        }
    </style>
</head>
<body class="min-h-screen p-6 flex flex-col items-center justify-center">

    <div class="max-w-md w-full space-y-6">
        <!-- Header -->
        <div class="glass-panel rounded-3xl p-8 text-center space-y-4 shadow-2xl">
            <div class="w-16 h-16 bg-sky-500/10 border border-sky-500/20 rounded-full flex items-center justify-center text-sky-400 text-2xl mx-auto">
                <i class="fa-solid fa-car-side"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white tracking-wider">V-SMART Fleet Hub</h1>
                <p class="text-xs text-slate-400 mt-1">ระบบบริหารจัดการยานพาหนะ องค์การบริหารส่วนตำบลข่วงเปา</p>
            </div>

            <div class="space-y-3 pt-4">
                <!-- ปุ่มเข้ารุ่น Pro -->
                <a href="v-smart-pro.html" class="w-full industrial-btn text-white font-bold p-4 rounded-2xl text-sm flex items-center justify-between shadow-xl block group">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-sky-500/10 flex items-center justify-center text-sky-400">
                            <i class="fa-solid fa-shield-halved"></i>
                        </div>
                        <div class="text-left">
                            <div class="text-sm font-bold text-slate-100">V-SMART Pro Edition</div>
                            <div class="text-[10px] text-slate-400">ระบบเต็มรูปแบบ 22 คัน / 7 ขั้นตอน</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-right text-sky-400 group-hover:translate-x-1 transition"></i>
                </a>

                <!-- ปุ่มเข้ารุ่น Lite -->
                <a href="v-smart-lite.html" class="w-full industrial-btn text-white font-bold p-4 rounded-2xl text-sm flex items-center justify-between shadow-xl block group">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-400">
                            <i class="fa-solid fa-bolt"></i>
                        </div>
                        <div class="text-left">
                            <div class="text-sm font-bold text-slate-100">V-SMART Lite Edition</div>
                            <div class="text-[10px] text-slate-400">รุ่นน้ำหนักเบา ใช้งานรวดเร็ว</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-arrow-right text-emerald-400 group-hover:translate-x-1 transition"></i>
                </a>
            </div>
        </div>

        <div class="text-center">
            <p class="text-[11px] text-slate-500 font-medium">อำเภอจอมทอง จังหวัดเชียงใหม่</p>
        </div>
    </div>

</body>
</html>
